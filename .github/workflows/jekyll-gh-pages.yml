# This workflow is managed by gh actions-lock.
# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697  # v1.0.13
        with:
          source: ./
          destination: ./_site
      - name: Overlay the canonical www bundle
        shell: bash
        run: |
          set -euo pipefail
          # actions/jekyll-build-pages runs in a container and writes _site as
          # root, so the runner user cannot create directories inside it.
          # Without this, the bundle copy below fails with "Permission denied".
          if [ -d _site ] && [ ! -w _site ]; then
            sudo chown -R "$(id -u):$(id -g)" _site
          fi
          # Publish the canonical bundle alongside whatever the SSG produced.
          #
          #   www/public/      -> the servable site root
          #   www/.well-known/ -> must be reachable at /.well-known/ on this
          #                       origin (RFC 9116, and RSR check
          #                       www/.well-known/security.txt)
          #
          # Everything else under www/ (dns/, policies/, profiles/, runbooks/,
          # errors/) is source material and is deliberately NOT published, so
          # only these two subtrees are copied rather than all of www/.
          #
          # Deliberately additive: the generated site is left intact, so this
          # cannot regress the existing pages.
          if [ -d www/public ]; then
            cp -a www/public/. _site/
          fi
          if [ -d www/.well-known ]; then
            mkdir -p _site/.well-known
            cp -a www/.well-known/. _site/.well-known/
          fi
          # Jekyll copied the repository tree, so the bundle *source* would be
          # served at /www/. The canonical location is the root, above.
          rm -rf _site/www
          echo "published tree:"
          find _site -maxdepth 2 | sort
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          # actions/upload-pages-artifact strips dot-entries by default
          # (its tar runs --exclude=.[^/]*), which silently removed
          # .well-known/ from the artifact. Publish it deliberately.
          include-hidden-files: true

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
