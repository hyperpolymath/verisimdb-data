# This workflow is managed by gh actions-lock.

name: Ingest Scan Results

on:
  repository_dispatch:
    types: [scan_result]
  workflow_dispatch:
    inputs:
      repo_name:
        description: 'Repository name'
        required: true
      scan_data:
        description: 'JSON scan data'
        required: true

permissions:
  contents: read

# Serialize ingests: concurrent repository_dispatch deliveries race on
# the commit+push and one writer loses. Queue them instead.
concurrency:
  group: verisimdb-data-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Store scan result
        env:
          REPO_NAME: ${{ github.event.client_payload.repo_name || github.event.inputs.repo_name }}
          SCAN_DATA: ${{ github.event.client_payload.scan_data || github.event.inputs.scan_data }}
        run: |
          # Event values come in through env, never pasted into the script.
          case "$REPO_NAME" in
            ''|*/*|.*) echo "::error::invalid repo_name"; exit 1 ;;
          esac
          printf '%s\n' "$SCAN_DATA" | jq . > "scans/${REPO_NAME}.json"

      - name: Commit scan, then rebuild index.json
        env:
          REPO_NAME: ${{ github.event.client_payload.repo_name || github.event.inputs.repo_name }}
        run: |
          git config user.name "VeriSimDB Bot"
          git config user.email "bot@verisimdb.org"
          git add "scans/${REPO_NAME}.json"
          git commit -m "scan: update ${REPO_NAME} results"
          # index.json is owned by regen-index.sh: last_updated is the commit
          # time of the latest scans/ commit. Fold the rebuilt index into the
          # same commit and keep its committer date so the freshness check
          # reproduces it exactly.
          bash scripts/regen-index.sh
          git add index.json
          GIT_COMMITTER_DATE="$(git log -1 --format=%cd --date=raw)" \
            git commit --amend --no-edit --allow-empty
          git push
